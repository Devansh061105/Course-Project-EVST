name: checks

# Runs the unit tests, then re-runs every analysis script from the cached data and
# compares the headline numbers with the documented values. No network or accounts
# are needed: GBIF and Earth Engine outputs are committed under data/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest -q tests
      - name: Reproduce every headline number
        run: python scripts/reproduce_all.py
      - name: Keep the logs if anything failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: repro-logs
          path: data/repro/
